<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>好友 — 漫域 MangaZone</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main class="wrap" style="max-width:760px">
    <h1>好友</h1>
    <p class="muted">发出申请、对方通过后即成为好友 · 好友关系仅用于互相查看主页与作品</p>
    <div class="tabs">
      <div class="tab on" data-tab="friends">好友列表</div>
      <div class="tab" data-tab="incoming">收到申请<span id="c-incoming"></span></div>
      <div class="tab" data-tab="outgoing">我的申请</div>
      <div class="tab" data-tab="search">查找用户</div>
    </div>
    <div class="panel" id="body"><p class="muted">加载中…</p></div>

    <div class="panel" id="search-box" style="display:none">
      <div class="row">
        <input id="q" class="grow" maxlength="30" placeholder="输入用户名（支持模糊匹配）">
        <button class="btn primary" id="btn-search">搜索</button>
      </div>
    </div>
  </main>
  <script src="/js/firebase-config.js"></script>
  <script src="/js/common.js"></script>
  <script>
    (async () => {
      await initHeader("friends");
      if (!ME) { location.href = "/login?next=" + encodeURIComponent("/friends"); return; }

      const bodyEl = document.getElementById("body");
      const searchBox = document.getElementById("search-box");
      let tab = "friends";

      const row = (html) => `<div class="list-row">${html}</div>`;
      const userLink = (u) => `<a class="grow" href="/user?id=${u.id || u.user_id}"><b>${esc(u.username)}</b></a>`;

      async function render() {
        searchBox.style.display = tab === "search" ? "" : "none";
        bodyEl.innerHTML = `<p class="muted">加载中…</p>`;
        if (tab === "friends") {
          const { friends } = await req("/api/friends");
          bodyEl.innerHTML = friends.length
            ? friends.map((f) => row(`${userLink(f)}
                <span class="muted" style="font-size:12px">${esc((f.since || "").slice(0, 10))}</span>
                ${friendButtonHtml(f.id, "friends")}`)).join("")
            : `<p class="muted">还没有好友，去「查找用户」添加吧。</p>`;
          bindFriendButtons(bodyEl, () => { render(); loadBadge(); });
        } else if (tab === "incoming" || tab === "outgoing") {
          const { requests } = await req(`/api/friends/requests?dir=${tab}`);
          bodyEl.innerHTML = requests.length
            ? requests.map((r) => row(`${userLink(r)}
                <span class="muted" style="font-size:12px">${esc(r.created_at.slice(0, 16))}</span>
                ${tab === "incoming"
                  ? `<button class="btn small primary" data-act="accept" data-id="${r.id}">接受</button>
                     <button class="btn small danger" data-act="reject" data-id="${r.id}">拒绝</button>`
                  : `<span class="badge">等待对方通过</span>`}`)).join("")
            : `<p class="muted">${tab === "incoming" ? "没有待处理的申请。" : "没有发出的待处理申请。"}</p>`;
          bodyEl.querySelectorAll("[data-act]").forEach((btn) => {
            btn.onclick = async () => {
              btn.disabled = true;
              try {
                await apiPost(`/api/friends/requests/${btn.dataset.id}/${btn.dataset.act}`, {});
                toast(btn.dataset.act === "accept" ? "已接受 🎉" : "已拒绝");
                render(); loadBadge();
              } catch (e) { toast(e.message); btn.disabled = false; }
            };
          });
        } else {
          bodyEl.innerHTML = `<p class="muted">在下方输入用户名搜索。</p>`;
        }
      }

      async function loadBadge() {
        const { count } = await req("/api/friends/incoming/count");
        document.getElementById("c-incoming").textContent = count > 0 ? ` (${count})` : "";
        refreshIncomingBadge();
      }

      document.querySelectorAll(".tab").forEach((t) => {
        t.onclick = () => {
          tab = t.dataset.tab;
          document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === t));
          render().catch((e) => { bodyEl.innerHTML = `<p class="msg err">${esc(e.message)}</p>`; });
        };
      });

      async function doSearch() {
        const q = document.getElementById("q").value.trim();
        if (!q) { toast("请输入用户名"); return; }
        bodyEl.innerHTML = `<p class="muted">搜索中…</p>`;
        const { users } = await req(`/api/users/search?q=${encodeURIComponent(q)}`);
        if (users.length === 0) { bodyEl.innerHTML = `<p class="muted">没有找到「${esc(q)}」相关用户</p>`; return; }
        bodyEl.innerHTML = users.map((u) => row(`${userLink(u)}
          <span class="muted" style="font-size:12px">${u.comic_count} 部作品</span>
          ${u.relationship === "self" ? `<span class="badge">这是你自己</span>` : friendButtonHtml(u.id, u.relationship)}`)).join("");
        bindFriendButtons(bodyEl, () => doSearch());
      }
      document.getElementById("btn-search").onclick = () => doSearch().catch((e) => { bodyEl.innerHTML = `<p class="msg err">${esc(e.message)}</p>`; });
      document.getElementById("q").addEventListener("keydown", (e) => { if (e.key === "Enter") doSearch().catch((er) => toast(er.message)); });

      await render();
      await loadBadge();
    })().catch((e) => { document.getElementById("body").textContent = "加载失败: " + e.message; });
  </script>
</body>
</html>
